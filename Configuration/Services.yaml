services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  LiquidLight\Anthology\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Pagination/PaginationState.php'

  LiquidLight\Anthology\Hook\PluginConfigurationHook:
    public: true

  LiquidLight\Anthology\Hook\FilterConfigurationHook:
    public: true
